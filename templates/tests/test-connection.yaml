apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mysql.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: mysql-test
      image: {{ include "mysql.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mysql.secretName" . }}
              key: mysql-root-password
      command:
        - /bin/bash
        - -ec
        - |
          {{- if eq .Values.architecture "replication" }}
          echo "Testing primary connection..."
          mysql -h{{ include "mysql.primary.fullname" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }} \
                -uroot \
                -p"${MYSQL_ROOT_PASSWORD}" \
                -e "SELECT 1" || exit 1
          echo "Primary connection successful!"
          
          echo "Testing secondary connection..."
          mysql -h{{ include "mysql.secondary.fullname" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }} \
                -uroot \
                -p"${MYSQL_ROOT_PASSWORD}" \
                -e "SELECT 1" || exit 1
          echo "Secondary connection successful!"
          {{- else }}
          echo "Testing MySQL connection..."
          mysql -h{{ include "mysql.primary.fullname" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }} \
                -uroot \
                -p"${MYSQL_ROOT_PASSWORD}" \
                -e "SELECT 1" || exit 1
          echo "Connection successful!"
          {{- end }}