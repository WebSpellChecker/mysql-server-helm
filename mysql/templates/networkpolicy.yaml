{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mysql.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mysql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if .Values.networkPolicy.allowExternal }}
  ingress:
    - ports:
        - port: 3306
        {{- if .Values.metrics.enabled }}
        - port: 9104
        {{- end }}
  {{- else }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "mysql.fullname" . }}-client: "true"
        {{- if .Values.networkPolicy.ingressRules.primaryAccessOnlyFrom.enabled }}
        {{- if .Values.networkPolicy.ingressRules.primaryAccessOnlyFrom.namespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressRules.primaryAccessOnlyFrom.namespaceSelector | nindent 12 }}
        {{- end }}
        {{- if .Values.networkPolicy.ingressRules.primaryAccessOnlyFrom.podSelector }}
        - podSelector:
            {{- toYaml .Values.networkPolicy.ingressRules.primaryAccessOnlyFrom.podSelector | nindent 12 }}
        {{- end }}
        {{- end }}
        {{- if .Values.networkPolicy.ingressRules.primaryAccessOnlyFrom.customRules }}
        {{- toYaml .Values.networkPolicy.ingressRules.primaryAccessOnlyFrom.customRules | nindent 8 }}
        {{- end }}
      ports:
        - port: 3306
        {{- if .Values.metrics.enabled }}
        - port: 9104
        {{- end }}
  {{- end }}
  egress:
    - {}
{{- end }}