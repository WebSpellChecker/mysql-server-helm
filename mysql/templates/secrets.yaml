{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "mysql.fullname" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "mysql.namespace" . | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.rootPassword }}
  mysql-root-password: {{ .Values.auth.rootPassword | b64enc | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "mysql-root-password") }}
  mysql-root-password: {{ index $existingSecret.data "mysql-root-password" }}
  {{- else }}
  mysql-root-password: {{ randAlphaNum 20 | b64enc | quote }}
  {{- end }}
  {{- if .Values.auth.username }}
    {{- if .Values.auth.password }}
  mysql-password: {{ .Values.auth.password | b64enc | quote }}
    {{- else if and $existingSecret (index $existingSecret.data "mysql-password") }}
  mysql-password: {{ index $existingSecret.data "mysql-password" }}
    {{- else }}
  mysql-password: {{ randAlphaNum 20 | b64enc | quote }}
    {{- end }}
  {{- end }}
  {{- if eq .Values.architecture "replication" }}
    {{- if .Values.auth.replicationPassword }}
  mysql-replication-password: {{ .Values.auth.replicationPassword | b64enc | quote }}
    {{- else if and $existingSecret (index $existingSecret.data "mysql-replication-password") }}
  mysql-replication-password: {{ index $existingSecret.data "mysql-replication-password" }}
    {{- else }}
  mysql-replication-password: {{ randAlphaNum 20 | b64enc | quote }}
    {{- end }}
  {{- end }}
{{- end }}