apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mysql.primary.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
    app.kubernetes.io/component: primary
spec:
  serviceName: {{ include "mysql.primary.fullname" . }}-headless
  replicas: 1
  podManagementPolicy: {{ .Values.primary.podManagementPolicy }}
  selector:
    matchLabels:
      {{- include "mysql.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: primary
  updateStrategy:
    {{- toYaml .Values.primary.updateStrategy | nindent 4 }}
  template:
    metadata:
      annotations:
        {{- if (include "mysql.primary.createConfigmap" .) }}
        checksum/configuration: {{ include (print $.Template.BasePath "/primary/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.passwordUpdateJob.enabled }}
        # Force pod restart when passwords are updated
        rollme: {{ randAlphaNum 10 | quote }}
        {{- end }}
        {{- with .Values.primary.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mysql.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: primary
        {{- with .Values.primary.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mysql.serviceAccountName" . }}
      {{- if .Values.primary.podSecurityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.primary.podSecurityContext.fsGroup }}
        runAsUser: {{ .Values.primary.podSecurityContext.runAsUser }}
      {{- end }}
      {{- with .Values.primary.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.primary.schedulerName }}
      schedulerName: {{ . | quote }}
      {{- end }}
      {{- with .Values.primary.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.primary.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.primary.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.primary.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.primary.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.primary.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.volumePermissions.enabled }}
        - name: volume-permissions
          image: {{ include "mysql.volumePermissions.image" . }}
          imagePullPolicy: {{ .Values.volumePermissions.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              chown -R {{ .Values.primary.podSecurityContext.runAsUser }}:{{ .Values.primary.podSecurityContext.fsGroup }} /var/lib/mysql
          securityContext:
            runAsUser: 0
          {{- with .Values.volumePermissions.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
        {{- end }}
        {{- if eq .Values.architecture "replication" }}
        - name: create-replication-user-script
          image: {{ include "mysql.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              echo "Creating replication user init script for primary..."
              mkdir -p /docker-entrypoint-initdb.d
              cat > /docker-entrypoint-initdb.d/00-create-replication-user.sh <<'EOF'
              #!/bin/bash
              set -e
              echo "Creating replication user on primary..."
              mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<MYSQL_EOF
              CREATE USER IF NOT EXISTS '${MYSQL_REPLICATION_USER}'@'%' IDENTIFIED BY '${MYSQL_REPLICATION_PASSWORD}';
              GRANT REPLICATION SLAVE ON *.* TO '${MYSQL_REPLICATION_USER}'@'%';
              FLUSH PRIVILEGES;
              SELECT User, Host FROM mysql.user WHERE User = '${MYSQL_REPLICATION_USER}';
              MYSQL_EOF
              echo "Replication user created successfully"
              EOF
              chmod +x /docker-entrypoint-initdb.d/00-create-replication-user.sh
              ls -la /docker-entrypoint-initdb.d/
              echo "Init script created successfully"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.secretName" . }}
                  key: mysql-root-password
            - name: MYSQL_REPLICATION_USER
              value: {{ .Values.auth.replicationUser | quote }}
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.secretName" . }}
                  key: mysql-replication-password
          volumeMounts:
            - name: init-scripts-replication
              mountPath: /docker-entrypoint-initdb.d
        {{- end }}
        {{- with .Values.primary.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: mysql
          image: {{ include "mysql.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- toYaml .Values.diagnosticMode.command | nindent 12 }}
          args: {{- toYaml .Values.diagnosticMode.args | nindent 12 }}
          {{- else if .Values.primary.command }}
          command: {{- toYaml .Values.primary.command | nindent 12 }}
          {{- end }}
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.primary.args }}
          args: {{- toYaml .Values.primary.args | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.primary.containerSecurityContext.enabled }}
          securityContext:
            runAsUser: {{ .Values.primary.containerSecurityContext.runAsUser }}
            runAsNonRoot: {{ .Values.primary.containerSecurityContext.runAsNonRoot }}
            allowPrivilegeEscalation: {{ .Values.primary.containerSecurityContext.allowPrivilegeEscalation }}
            {{- with .Values.primary.containerSecurityContext.capabilities }}
            capabilities:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- end }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              {{- if .Values.auth.usePasswordFiles }}
              value: ""
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.secretName" . }}
                  key: mysql-root-password
              {{- end }}
            {{- if .Values.auth.username }}
            - name: MYSQL_USER
              value: {{ .Values.auth.username | quote }}
            - name: MYSQL_PASSWORD
              {{- if .Values.auth.usePasswordFiles }}
              value: ""
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.secretName" . }}
                  key: mysql-password
              {{- end }}
            {{- end }}
            {{- if .Values.auth.database }}
            - name: MYSQL_DATABASE
              value: {{ .Values.auth.database | quote }}
            {{- end }}
            {{- if eq .Values.architecture "replication" }}
            - name: MYSQL_REPLICATION_USER
              value: {{ .Values.auth.replicationUser | quote }}
            - name: MYSQL_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.secretName" . }}
                  key: mysql-replication-password
            {{- end }}
            {{- with .Values.primary.extraEnvVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.primary.extraEnvVarsCM .Values.primary.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.primary.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.primary.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.primary.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.primary.extraEnvVarsSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: mysql
              containerPort: {{ .Values.primary.containerPorts.mysql }}
              protocol: TCP
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.primary.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  # For existing installations, password might be different from env var
                  # Try connecting without password first (for fresh installs during init)
                  if mysqladmin ping -uroot 2>/dev/null; then
                    exit 0
                  fi
                  # Try with environment variable password
                  if mysqladmin ping -uroot -p"${MYSQL_ROOT_PASSWORD}" 2>/dev/null; then
                    exit 0
                  fi
                  # If both fail, the database is not accessible
                  exit 1
            initialDelaySeconds: {{ .Values.primary.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.primary.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.primary.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.primary.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.primary.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.primary.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  # For existing installations, password might be different from env var
                  # Try connecting without password first (for fresh installs during init)
                  if mysqladmin ping -uroot 2>/dev/null; then
                    exit 0
                  fi
                  # Try with environment variable password
                  if mysqladmin ping -uroot -p"${MYSQL_ROOT_PASSWORD}" 2>/dev/null; then
                    exit 0
                  fi
                  # If both fail, the database is not accessible
                  exit 1
            initialDelaySeconds: {{ .Values.primary.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.primary.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.primary.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.primary.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.primary.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.primary.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  # For existing installations, password might be different from env var
                  # Try connecting without password first (for fresh installs during init)
                  if mysqladmin ping -uroot 2>/dev/null; then
                    exit 0
                  fi
                  # Try with environment variable password
                  if mysqladmin ping -uroot -p"${MYSQL_ROOT_PASSWORD}" 2>/dev/null; then
                    exit 0
                  fi
                  # If both fail, the database is not accessible
                  exit 1
            initialDelaySeconds: {{ .Values.primary.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.primary.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.primary.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.primary.startupProbe.successThreshold }}
            failureThreshold: {{ .Values.primary.startupProbe.failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.primary.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            {{- if (include "mysql.primary.createConfigmap" .) }}
            - name: config
              mountPath: /etc/mysql/conf.d/
            {{- end }}
            {{- if eq .Values.architecture "replication" }}
            - name: init-scripts-replication
              mountPath: /docker-entrypoint-initdb.d/
            - name: replication-config
              mountPath: /tmp/replication-scripts/
            {{- end }}
            {{- if .Values.initdbScriptsConfigMap }}
            - name: custom-init-scripts
              mountPath: /docker-entrypoint-initdb.d/
            {{- end }}
            {{- if .Values.initdbScripts }}
            - name: custom-init-scripts-cm
              mountPath: /docker-entrypoint-initdb.d/
            {{- end }}
            {{- if .Values.auth.usePasswordFiles }}
            - name: mysql-credentials
              mountPath: /var/lib/mysql
            {{- end }}
            {{- with .Values.primary.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.primary.lifecycleHooks }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          image: {{ include "mysql.metrics.image" . }}
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mysql.secretName" . }}
                  key: mysql-root-password
          command:
            - /bin/sh
            - -c
            - |
              echo "Creating .my.cnf with credentials..."
              cat > /tmp/.my.cnf << EOF
              [client]
              user=root
              password=${MYSQL_ROOT_PASSWORD}
              host=127.0.0.1
              port=3306
              EOF
              echo "Starting mysqld_exporter..."
              exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf --web.listen-address=":9104" {{ range .Values.metrics.extraArgs.primary }}{{ . }} {{ end }}
          ports:
            - name: metrics
              containerPort: 9104
              protocol: TCP
          {{- if .Values.metrics.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: {{ .Values.metrics.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.metrics.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.metrics.livenessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.metrics.livenessProbe.successThreshold }}
            failureThreshold: {{ .Values.metrics.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.metrics.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: {{ .Values.metrics.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.metrics.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.metrics.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.metrics.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.metrics.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.auth.usePasswordFiles }}
          volumeMounts:
            - name: mysql-credentials
              mountPath: /var/lib/mysql
          {{- end }}
        {{- end }}
        {{- with .Values.primary.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- if (include "mysql.primary.createConfigmap" .) }}
        - name: config
          configMap:
            name: {{ include "mysql.primary.fullname" . }}
        {{- end }}
        {{- if eq .Values.architecture "replication" }}
        - name: init-scripts-replication
          emptyDir: {}
        - name: replication-config
          configMap:
            name: {{ include "mysql.primary.fullname" . }}-replication
            defaultMode: 0755
        {{- end }}
        {{- if .Values.initdbScriptsConfigMap }}
        - name: custom-init-scripts
          configMap:
            name: {{ .Values.initdbScriptsConfigMap }}
        {{- end }}
        {{- if .Values.initdbScripts }}
        - name: custom-init-scripts-cm
          configMap:
            name: {{ include "mysql.primary.fullname" . }}-init-scripts
        {{- end }}
        {{- if .Values.auth.usePasswordFiles }}
        - name: mysql-credentials
          secret:
            secretName: {{ include "mysql.secretName" . }}
            items:
              - key: mysql-root-password
                path: .mysql_password
        {{- end }}
        {{- if not .Values.primary.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.primary.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.primary.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.primary.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- if and .Values.primary.persistence.enabled (not .Values.primary.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mysql.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: primary
        {{- with .Values.primary.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.primary.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.primary.persistence.size | quote }}
        {{- with .Values.primary.persistence.selector }}
        selector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- include "mysql.storageClass" .Values.primary.persistence | nindent 8 }}
  {{- end }}