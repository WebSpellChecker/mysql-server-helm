{{- if .Values.passwordUpdateJob.enabled }}
{{- $fullName := include "mysql.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-previous-secret
  namespace: {{ .Release.Namespace }}
  labels: {{- include "mysql.labels" . | nindent 4 }}
    app.kubernetes.io/component: password-update
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
data:
  {{- if .Values.passwordUpdateJob.previousPasswords.rootPassword }}
  mysql-root-password: {{ .Values.passwordUpdateJob.previousPasswords.rootPassword | b64enc | quote }}
  {{- else if .Values.passwordUpdateJob.previousPasswords.existingSecret }}
  # Using existing secret for previous passwords
  {{- else }}
  {{- fail "passwordUpdateJob.previousPasswords.rootPassword is required when passwordUpdateJob is enabled" }}
  {{- end }}
  {{- if and .Values.auth.username .Values.passwordUpdateJob.previousPasswords.password }}
  mysql-password: {{ .Values.passwordUpdateJob.previousPasswords.password | b64enc | quote }}
  {{- end }}
  {{- if and (eq .Values.architecture "replication") .Values.passwordUpdateJob.previousPasswords.replicationPassword }}
  mysql-replication-password: {{ .Values.passwordUpdateJob.previousPasswords.replicationPassword | b64enc | quote }}
  {{- end }}
{{- end }}